<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Without Border - منصة الذكاء الموحدة</title>
    <!-- تصحيح استدعاء مكتبة BrowserAI لتشغيل النماذج محلياً عبر المتصفح -->
    <script type="module">
        import { BrowserAI } from 'https://jsdelivr.net';
        window.BrowserAI = BrowserAI;
    </script>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --input-bg: #161719;
            --panel-bg: #1e2022;
            --text-color: #f1f3f4;
            --text-muted: #9aa0a6;
            --accent-glow: rgba(168, 199, 250, 0.15);
            --border-color: #2c2e31;
            --status-connected: #00e676;
            --status-alert: #ff5252;
            --status-suggested: #a8c7fa;
            --hubspot-color: #ff7a59;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            align-items: center;
            overflow: hidden;
        }

        .chat-area {
            flex-grow: 1;
            width: 100%;
            max-width: 650px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.2s ease-in-out;
        }

        .message.ai {
            background-color: #161719;
            align-self: flex-end;
            border: 1px solid var(--border-color);
        }

        .message.user {
            background-color: #2b394a;
            align-self: flex-start;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-wrapper {
            position: relative;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* لوحة التحكم المنبثقة للمكونات المضافة */
        .hub-panel {
            position: absolute;
            bottom: 80px;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 100;
            padding: 16px;
            box-sizing: border-box;
        }

        .search-box-wrapper {
            margin-bottom: 12px;
            width: 100%;
        }

        .hub-search-input {
            width: 100%;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 14px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .hub-content {
            max-height: 180px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .hub-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            cursor: pointer;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
        }
        .status-dot.active { background-color: var(--status-connected); }
        .status-dot.suggest { background-color: var(--status-suggested); }

        .action-link { font-size: 11px; color: var(--status-suggested); font-weight: bold; }

        .input-bar {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
        }

        .plus-btn {
            background-color: #2c2e31;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .plus-btn.active { transform: rotate(45deg); }

        .chat-input {
            flex-grow: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            padding: 10px 4px;
            outline: none;
            height: 22px;
            font-family: inherit;
        }

        .send-btn {
            background-color: var(--status-suggested);
            color: #000;
            border: none;
            font-size: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* نافذة المودال لإدخال الـ Token الخاص بـ HubSpot */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; display: none;
        }

        .modal-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px; width: 90%; max-width: 400px;
            box-sizing: border-box; text-align: center;
        }

        .modal-box input {
            width: 100%; padding: 10px; margin: 15px 0;
            background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 10px; color: white; outline: none; box-sizing: border-box;
        }

        .modal-btn { padding: 8px 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 0 4px; }
        .btn-connect { background-color: var(--hubspot-color); color: white; }
        .btn-cancel { background-color: #444; color: white; }
    </style>
</head>
<body>

    <div class="chat-area" id="chatArea">
        <div class="message ai" id="statusMessage">🤖 نظامك مستعد ومربوط بـ BrowserAI وجاهز للاستضافة على Vercel! اضغط على زر (+) لإدارة مكونات مشروعك Folder Without Border.</div>
    </div>

    <!-- شاشة إدخال الـ Token لمكون HubSpot المدمج -->
    <div class="modal-overlay" id="hubspotModal">
        <div class="modal-box">
            <h3 style="color: var(--hubspot-color); margin-top:0;">🔗 ربط HubSpot CRM</h3>
            <p style="font-size:12px; color:var(--text-muted);">أدخل مفتاح الـ API الخاص بـ HubSpot لتمكين المزامنة البرمجية.</p>
            <input type="password" id="hubspotKey" placeholder="أدخل الـ Private App Token...">
            <div>
                <button class="modal-btn btn-connect" onclick="confirmHubspot()">تأكيد الربط</button>
                <button class="modal-btn btn-cancel" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="control-wrapper">
        <!-- لوحة فلترة المكونات المضافة المبتكرة -->
        <div class="hub-panel" id="hubPanel">
            <div class="search-box-wrapper">
                <input type="text" id="hubSearch" class="hub-search-input" placeholder="ابحث عن مكون (HubSpot, Replit, Zapier)...">
            </div>
            <div class="hub-content" id="hubContent"></div>
        </div>

        <div class="input-bar">
            <button class="plus-btn" id="plusBtn">＋</button>
            <input type="text" id="chatInput" class="chat-input" placeholder="اكتب وتفاعل مع نموذج الـ AI المحلي...">
            <button class="send-btn" onclick="handleSend()">⬆️</button>
        </div>
    </div>
